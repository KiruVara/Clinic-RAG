spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: rag
    password: rag

  ai:
    model:
      chat: ollama
      embedding: ollama

    ollama:
      chat:
        options:
          model: llama3
          temperature: 0.2
          max-tokens: 600

      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
